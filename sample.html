  .pp-toast {

    padding: 12px 16px;
    border-radius: 6px;
    color: #fff;
    font-size: 14px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.15);
    animation: slideIn 0.25s ease-out;
  }

  .pp-toast-success { background: #16a34a; }
  .pp-toast-error   { background: #dc2626; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>

  <script>
    function onDropdownChangeSelect(selectedOption) {
      const selectContainer = document.querySelector("[data-pp-select]");
      if (!selectContainer) return;

      // Normalize value (radio group usually sends string)
      const value = Array.isArray(selectedOption)
        ? selectedOption[0]
        : selectedOption;

      if (value === "multiple select") {
        // Enable multi select
        selectContainer.dataset.multiple = "true";
      } else {
        // Enable single select
        selectContainer.dataset.multiple = "false";
      }

      // Clear previous selection
      selectContainer.innerHTML = "";

      // Reinitialize select component
      if (typeof initSelectMenus === "function") {
        initSelectMenus();
      }
    }
  </script>

<script>
  function onFileModeChange(selectedOptions) {
      const fileInput = document.querySelector("[data-pp-file]");
      if (!fileInput) return;

      // If "Allowed Multiple files" is selected → enable multiple
      if (selectedOptions.includes("Allowed Multiple files")) {
        fileInput.multiple = true; 
      } else {
        fileInput.multiple = false;   
    }
  }
</script>
<script>
  let activeMode = null;

  function toISO(val) {
    const [m, d, y] = val.split("/");
    return `${y}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`;
  }

  function openRangePicker(mode) {
    activeMode = mode;
    const wrapper = document.getElementById("rangePickerWrapper");
    const picker = document.getElementById("rangePicker");

    wrapper.style.display = "inline-block";
    picker.focus();
    picker.click();
  }

  document.addEventListener("DOMContentLoaded", () => {
    const picker = document.getElementById("rangePicker");
    const main = document.getElementById("mainDateInput");

    picker.addEventListener("change", e => {
      const val = e.target.value; // MM/DD/YYYY
      if (!val || !activeMode) return;

      if (activeMode === "min") {
        main.dataset.minDate = val;
        document.getElementById("minLabel").textContent = val;
      }

      if (activeMode === "max") {
        main.dataset.maxDate = val;
        document.getElementById("maxLabel").textContent = val;
      }

      // Apply constraints to main input
      initDatepicker();

      // Reset picker
      picker.value = "";
      document.getElementById("rangePickerWrapper").style.display = "none";
      activeMode = null;
    });
  });

  function onDateChange(value) {
    // ALWAYS valid date (browser enforces min/max)
    console.log("Final valid date selected:", value);
  }
</script>
