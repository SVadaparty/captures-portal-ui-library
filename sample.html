<!DOCTYPE html>
<html>


<head>
  <title>Sample Page Test</title>
  <link rel="stylesheet" href="./dist/pp-ui-core.min.css">
</head>

<body>
  <h2>This is testing page</h2>

  <!-- INPUTS -->
  <input  data-width="60%" data-pp-input data-placeholder="Email" data-type="email" />

  <br /><br />
  <select   data-width="60%" data-pp-dropdown data-options='["Select Program","A","B","C"]' data-onchange="onProgramChange">
  </select>
  <br /><br />
 <div
  data-pp-radio-group
  data-name="subscription"
  data-layout="row"
  data-options='["Monthly","Quarterly","Yearly"]'
  data-onchange="onGenderChange">
</div>
  </div>
  <br /><br />
 
  <div
  data-pp-checkbox-group
  data-layout="column"
  data-options='["Option A","Option B","Option C"]'
  data-onchange="onPreferenceChange">
</div>

  <br /><br />

<input
  data-pp-datepicker
  data-width="40%"
  data-onchange="onDateChange"
/>
 <br /><br />


<input
  data-pp-file
  data-align="left"
  data-width="40%"
  data-max-size="5"
  data-multiple="false"
  data-accept=".pdf,.doc,.docx"
  data-onchange="onFileUpload"
/>
 <br /><br />
  <!-- BUTTONS -->
  <button data-pp-button data-label="Save" data-type="primary">
  </button>

  <button data-pp-button data-label="Cancel" data-type="secondary" data-onclick="handleSave">
  </button>
  <script>
    function onProgramChange(value) {
      alert("Selected: " + value);
    }
  </script>
  <script>
    function onGenderChange(value) {
      alert("Selected Gender: " + value);
    }

  </script>
  <script>
    function onPreferenceChange(selectedOptions) {
      alert("Selected Preferences: " + selectedOptions.join(", "));
    }
  </script>
  <script>
    function onFileUpload(files) {
  for (let file of files) {
    alert("File name: " + file.name);
    alert("File size: " + file.size + " bytes");
    alert("File type: " + file.type);
  }
}
  </script>

  <div data-pp-table data-datasource="usersData" data-search="true" data-filter="true" data-search-placeholder="Search"
    data-filter-placeholder="Select column" data-width="100%" data-font-family="sans-serif" data-font-size="14px"
    data-border-color="#000" data-header-bg="#b7c9e6" data-header-text-color="#03025f" data-row-hover-bg="#fafafa"
    data-text-color="#000" data-page-size="2" data-sticky-header="true" data-column-toggle="true">
  </div>
