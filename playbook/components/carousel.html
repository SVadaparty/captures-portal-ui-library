<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PP Carousel – Playbook</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Inter, system-ui, sans-serif;
  background: #f8fafc;
}

/* ===== LAYOUT ===== */
.layout {
  display: grid;
  grid-template-columns: 360px 1fr;
  height: 100vh;
}

/* ===== CONTROLS ===== */
.controls {
  background: #020617;
  color: white;
  padding: 20px;
  overflow-y: auto;
}

.controls h2 {
  color: #38bdf8;
  margin-top: 0;
}

.controls label {
  display: block;
  margin-top: 14px;
  font-size: 13px;
  color: #cbd5f5;
}

.controls input {
  width: 100%;
  padding: 8px;
  border-radius: 6px;
  border: none;
  margin-top: 4px;
}

/* ===== PREVIEW ===== */
.preview {
  padding: 32px;
  overflow-y: auto;
}

.preview-box {
  background: white;
  padding: 24px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,.05);
  margin-bottom: 24px;
}

pre {
  background: #020617;
  color: #38bdf8;
  padding: 16px;
  border-radius: 8px;
  font-size: 13px;
  overflow-x: auto;
}
</style>
</head>

<body>

<div class="layout">

  <!-- ===== CONTROLS ===== -->
  <div class="controls">
    <h2>Carousel Settings</h2>

    <label>Visible Slides</label>
    <input id="pb-visible" type="number" value="3">

    <label>Gap (px)</label>
    <input id="pb-gap" type="number" value="16">

    <label>Autoplay Interval (ms)</label>
    <input id="pb-interval" type="number" value="1000">

    <hr style="margin:16px 0;border-top:1px solid #334155;">

    <h3 style="color:#38bdf8;font-size:14px;">Slide Images</h3>

    <label>Image 1 URL</label>
    <input id="img1" value="https://picsum.photos/seed/picsum/800/300">

    <label>Image 2 URL</label>
    <input id="img2" value="https://picsum.photos/id/237/800/300">

    <label>Image 3 URL</label>
    <input id="img3" value="https://picsum.photos/seed/picsum/800/300">

    <label>Image 4 URL</label>
    <input id="img4" value="https://picsum.photos/id/237/800/300">
  </div>

  <!-- ===== PREVIEW ===== -->
  <div class="preview">
    <h1>Power Pages – Carousel</h1>
    <a href="../index.html" class="playbook-back">← Back to Playbook</a>

    <div class="preview-box">
      <div id="carouselHost"></div>
    </div>

    <div class="preview-box">
      <h2>Generated HTML</h2>
      <pre id="codeBlock"></pre>
    </div>
  </div>

</div>

<script>
function v(id) {
  return document.getElementById(id).value;
}

function sync() {
  const host = document.getElementById("carouselHost");
  const code = document.getElementById("codeBlock");

  const visible = v("pb-visible");
  const gap = v("pb-gap");
  const interval = v("pb-interval");
  const images = [v("img1"), v("img2"), v("img3"), v("img4")];

  host.innerHTML = "";

  const carousel = document.createElement("div");
  carousel.setAttribute("data-pp-carousel", "");
  carousel.dataset.visible = visible;
  carousel.dataset.gap = gap;
  carousel.dataset.autoplay = "true";
  carousel.dataset.autoplayInterval = interval;

  images.forEach((src, i) => {
    if (!src) return;

    const card = document.createElement("div");
    card.setAttribute("data-pp-card", "");
    card.dataset.title = `Card ${i + 1}`;

    const img = document.createElement("img");
    img.setAttribute("data-pp-card-img", "");
    img.src = src;
    img.style.width = "100%";
    img.style.borderRadius = "8px";

    card.appendChild(img);
    carousel.appendChild(card);
  });

  host.appendChild(carousel);
  initCarousel();

  code.textContent =
`<div
  data-pp-carousel
  data-visible="${visible}"
  data-gap="${gap}"
  data-autoplay="true"
  data-autoplay-interval="${interval}">
${images.map((src, i) => src ? `
  <div data-pp-card data-title="Card ${i + 1}">
    <img data-pp-card-img src="${src}">
  </div>` : "").join("")}
</div>`;
}

/* ===== FIXED CAROUSEL JS (AUTOPLAY WORKING) ===== */
function initCarousel() {
  document.querySelectorAll("[data-pp-carousel]").forEach(carousel => {
    if (carousel._initialized) return;
    carousel._initialized = true;

    const visible = parseInt(carousel.dataset.visible || "3");
    const gap = parseInt(carousel.dataset.gap || "16");
    const autoplay = carousel.dataset.autoplay === "true";
    const interval = parseInt(carousel.dataset.autoplayInterval || "1000");

    const track = document.createElement("div");
    track.style.display = "flex";
    track.style.gap = gap + "px";
    track.style.transition = "transform 0.4s ease";

    const items = Array.from(carousel.children);
    items.forEach(item => {
      const slide = document.createElement("div");
      slide.appendChild(item);
      track.appendChild(slide);
    });

    carousel.innerHTML = "";
    carousel.style.overflow = "hidden";
    carousel.appendChild(track);

    let index = 0;
    const maxIndex = Math.max(0, items.length - visible);

    function updateLayout() {
      const w = carousel.clientWidth;
      const slideW = (w - gap * (visible - 1)) / visible;
      track.querySelectorAll("div").forEach(s => {
        s.style.flex = `0 0 ${slideW}px`;
      });
      update();
    }

    function update() {
      const slide = track.querySelector("div");
      if (!slide) return;
      const slideWidth = slide.offsetWidth + gap;
      track.style.transform = `translateX(-${index * slideWidth}px)`;
    }

    updateLayout();
    window.addEventListener("resize", updateLayout);

    /* ===== AUTOPLAY ===== */
    let timer = null;

    function start() {
      if (!autoplay) return;
      timer = setInterval(() => {
        index = index >= maxIndex ? 0 : index + 1;
        update();
      }, interval);
    }

    function stop() {
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
    }

    carousel.addEventListener("mouseenter", stop);
    carousel.addEventListener("mouseleave", start);

    start();
  });
}

document
  .querySelectorAll(".controls input")
  .forEach(el => el.addEventListener("input", sync));

window.addEventListener("load", sync);
</script>

</body>
</html>
