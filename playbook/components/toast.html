<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PP Playbook – Toast & Input</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Inter, system-ui, sans-serif;
  background: #f8fafc;
}

/* ===== LAYOUT ===== */
.layout {
  display: grid;
  grid-template-columns: 360px 1fr;
  height: 100vh;
}

/* ===== CONTROLS ===== */
.controls {
  background: #020617;
  color: white;
  padding: 20px;
  overflow-y: auto;
}

.controls h2 {
  color: #38bdf8;
  margin-top: 0;
}

.controls label {
  display: block;
  margin-top: 14px;
  font-size: 13px;
  color: #cbd5f5;
}

.controls input,
.controls select {
  width: 100%;
  padding: 8px;
  border-radius: 6px;
  border: none;
  margin-top: 4px;
  font-size: 14px;
}

/* ===== PREVIEW ===== */
.preview {
  padding: 32px;
  overflow-y: auto;
}

.preview-box {
  background: white;
  padding: 24px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,.05);
  margin-bottom: 24px;
}

pre {
  background: #020617;
  color: #38bdf8;
  padding: 16px;
  border-radius: 8px;
  font-size: 13px;
  overflow-x: auto;
}
</style>
</head>

<body>

<div class="layout">

  <!-- ===== CONTROLS ===== -->
  <div class="controls">
    <h2>Toast Settings</h2>

    <label>Toast Position</label>
    <select id="pb-position">
      <option value="top-right">Top Right</option>
      <option value="top-left">Top Left</option>
      <option value="bottom-right">Bottom Right</option>
      <option value="bottom-left">Bottom Left</option>
    </select>

    <label>Toast Duration (ms)</label>
    <input id="pb-duration" type="number" value="3000"/>

    <hr style="margin:16px 0;border-top:1px solid #334155;">

    <h2>Input Form</h2>

    <label>Input Placeholder</label>
    <input id="pb-placeholder" value="Enter value"/>

    <label>Submit Button Text</label>
    <input id="pb-button" value="Submit"/>
  </div>

  <!-- ===== PREVIEW ===== -->
  <div class="preview">

    <h1>Power Pages – Toast & Input</h1>

    <!-- 🔥 REQUIRED PREVIEW BLOCK -->
    <div class="preview-box">
      <div
        id="toastHost"
        data-pp-toast
        data-position="top-right"
        data-duration="3000">
      </div>

      <div
        id="formHost"
        data-pp-input-form
        style="margin-top:20px;">
      </div>
    </div>

    <!-- GENERATED HTML -->
    <div class="preview-box">
      <h2>Generated HTML</h2>
      <pre id="codeBlock"></pre>
    </div>

  </div>
</div>

<script>
/* ================= TOAST ================= */
function initToast() {
  document.querySelectorAll("[data-pp-toast]").forEach(container => {
    if (container._initialized) return;
    container._initialized = true;

    const position = container.dataset.position || "top-right";
    const duration = parseInt(container.dataset.duration || "3000");

    container.innerHTML = "";

    const positions = {
      "top-right": { top: "20px", right: "20px" },
      "top-left": { top: "20px", left: "20px" },
      "bottom-right": { bottom: "20px", right: "20px" },
      "bottom-left": { bottom: "20px", left: "20px" }
    };

    container.style.position = "fixed";
    container.style.zIndex = "9999";
    Object.assign(container.style, positions[position]);
    container.style.display = "flex";
    container.style.flexDirection = "column";
    container.style.gap = "10px";
    container.style.pointerEvents = "none";

    window.showToast = function (message, type = "success") {
      const toast = document.createElement("div");
      const colors = {
        success: "#16a34a",
        error: "#dc2626",
        warning: "#d97706"
      };

      toast.textContent = message;
      toast.style.padding = "12px 16px";
      toast.style.borderRadius = "6px";
      toast.style.background = colors[type];
      toast.style.color = "#fff";
      toast.style.fontSize = "14px";
      toast.style.pointerEvents = "auto";

      container.appendChild(toast);
      setTimeout(() => toast.remove(), duration);
    };
  });
}

/* ================= INPUT FORM ================= */
function initInputForm() {
  document.querySelectorAll("[data-pp-input-form]").forEach(container => {
    if (container._initialized) return;
    container._initialized = true;

    const placeholder = container.dataset.placeholder || "Enter value";
    const buttonText = container.dataset.button || "Submit";

    container.innerHTML = `
      <input
        data-pp-input
        placeholder="${placeholder}"
        style="padding:10px;width:100%;border:1px solid #e5e7eb;border-radius:6px;"
      />
      <button
        type="button"
        style="margin-top:10px;padding:10px 14px;border:none;border-radius:6px;
        background:#2563eb;color:white;font-weight:600;cursor:pointer;">
        ${buttonText}
      </button>
    `;

    const input = container.querySelector("input");
    const button = container.querySelector("button");

    button.onclick = () => {
      if (!input.value) return showToast("Input cannot be empty", "error");
      showToast("Submitted successfully!", "success");
      input.value = "";
    };
  });
}

/* ================= PLAYBOOK SYNC (FIXED) ================= */
function sync() {
  const pos = pb-position.value;
  const dur = pb-duration.value;
  const placeholder = pb-placeholder.value;
  const btn = pb-button.value;

  toastHost.dataset.position = pos;
  toastHost.dataset.duration = dur;

  formHost.dataset.placeholder = placeholder;
  formHost.dataset.button = btn;

  toastHost._initialized = false;
  formHost._initialized = false;

  initToast();
  initInputForm();

  /* ✅ GENERATED HTML NOW DYNAMIC */
  codeBlock.textContent =
`<div
  data-pp-toast
  data-position="${pos}"
  data-duration="${dur}">
</div>

<div
  data-pp-input-form
  data-placeholder="${placeholder}"
  data-button="${btn}">
</div>`;
}

document
  .querySelectorAll(".controls input, .controls select")
  .forEach(el => el.addEventListener("input", sync));

window.addEventListener("load", () => {
  initToast();
  initInputForm();
  sync();
});
</script>

</body>
</html>
