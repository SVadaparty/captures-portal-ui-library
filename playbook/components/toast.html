<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PP Playbook – Toast & Input</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Inter, system-ui, sans-serif;
  background: #f8fafc;
}

/* ===== LAYOUT ===== */
.layout {
  display: grid;
  grid-template-columns: 360px 1fr;
  height: 100vh;
}

/* ===== CONTROLS ===== */
.controls {
  background: #020617;
  color: white;
  padding: 20px;
  overflow-y: auto;
}

.controls h2 {
  color: #38bdf8;
  margin-top: 0;
}

.controls label {
  display: block;
  margin-top: 14px;
  font-size: 13px;
  color: #cbd5f5;
}

.controls input {
  width: 100%;
  padding: 8px;
  border-radius: 6px;
  border: none;
  margin-top: 4px;
  font-size: 14px;
}

/* ===== PREVIEW ===== */
.preview {
  padding: 32px;
  overflow-y: auto;
}

.preview-box {
  background: white;
  padding: 24px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,.05);
  margin-bottom: 24px;
}

pre {
  background: #020617;
  color: #38bdf8;
  padding: 16px;
  border-radius: 8px;
  font-size: 13px;
  overflow-x: auto;
}
</style>
</head>

<body>

<div class="layout">

  <!-- ===== CONTROLS ===== -->
  <div class="controls">
    <h2>Toast</h2>

    <label>Toast Duration (ms)</label>
    <input id="pb-duration" type="number" value="3000" />

    <hr style="margin:16px 0;border-top:1px solid #334155;">

    <h2>Input Form</h2>

    <label>Input Placeholder</label>
    <input id="pb-placeholder" value="Enter value" />

    <label>Submit Button Text</label>
    <input id="pb-button" value="Submit" />
  </div>

  <!-- ===== PREVIEW ===== -->
  <div class="preview">

    <h1>Power Pages – Toast & Input</h1>

    <div class="preview-box">
      <div id="toastHost" data-pp-toast data-duration="3000"></div>

      <div
        id="formHost"
        data-pp-input-form
        style="margin-top:20px;">
      </div>
    </div>

    <div class="preview-box">
      <h2>Generated HTML (Production)</h2>
      <pre id="codeBlock"></pre>
    </div>

  </div>
</div>

<script>
/* ================= TOAST (PRODUCTION SAFE) ================= */
function initToast() {
  document.querySelectorAll("[data-pp-toast]").forEach(container => {
    if (container._initialized) return;
    container._initialized = true;

    const duration = parseInt(container.dataset.duration || "3000");

    container.innerHTML = "";
    Object.assign(container.style, {
      position: "fixed",
      top: "20px",
      right: "20px",
      zIndex: "9999",
      display: "flex",
      flexDirection: "column",
      gap: "10px",
      pointerEvents: "none"
    });

    if (!window.showToast) {
      window.showToast = function (message, type = "success") {
        const toast = document.createElement("div");
        const colors = {
          success: "#16a34a",
          error: "#dc2626",
          warning: "#d97706"
        };

        toast.textContent = message;
        Object.assign(toast.style, {
          padding: "12px 16px",
          borderRadius: "6px",
          background: colors[type] || colors.success,
          color: "#fff",
          fontSize: "14px",
          pointerEvents: "auto"
        });

        container.appendChild(toast);
        setTimeout(() => toast.remove(), duration);
      };
    }
  });
}

/* ================= INPUT FORM ================= */
function initInputForm() {
  document.querySelectorAll("[data-pp-input-form]").forEach(container => {
    if (container._initialized) return;
    container._initialized = true;

    const placeholder = container.dataset.placeholder || "Enter value";
    const buttonText = container.dataset.button || "Submit";

    container.innerHTML = `
      <input
        placeholder="${placeholder}"
        style="padding:10px;width:100%;border:1px solid #e5e7eb;border-radius:6px;"
      />
      <button
        type="button"
        style="margin-top:10px;padding:10px 14px;border:none;border-radius:6px;
        background:#2563eb;color:white;font-weight:600;cursor:pointer;">
        ${buttonText}
      </button>
    `;

    const input = container.querySelector("input");
    const button = container.querySelector("button");

    button.onclick = () => {
      if (!input.value.trim()) {
        showToast("Input cannot be empty", "error");
        return;
      }
      showToast("Submitted successfully!", "success");
      input.value = "";
    };
  });
}

/* ================= PLAYBOOK SYNC ================= */
function sync() {
  const duration = document.getElementById("pb-duration").value;
  const placeholder = document.getElementById("pb-placeholder").value;
  const button = document.getElementById("pb-button").value;

  toastHost.dataset.duration = duration;
  formHost.dataset.placeholder = placeholder;
  formHost.dataset.button = button;

  toastHost._initialized = false;
  formHost._initialized = false;

  initToast();
  initInputForm();

  codeBlock.textContent =
`<div data-pp-toast data-duration="${duration}"></div>

<div
  data-pp-input-form
  data-placeholder="${placeholder}"
  data-button="${button}">
</div>`;
}

document
  .querySelectorAll(".controls input")
  .forEach(el => el.addEventListener("input", sync));

window.addEventListener("load", () => {
  initToast();
  initInputForm();
  sync();
});
</script>

</body>
</html>
