<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PP Multi Dropdown – Playbook</title>

<link rel="stylesheet" href="../../dist/pp-ui-core.min.css"/>
<script src="../../dist/pp-ui-core.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Segoe UI, system-ui, sans-serif;
  background: #f3f4f6;
}

.layout {
  display: grid;
  grid-template-columns: 360px 1fr;
  height: 100vh;
}

.sidebar {
  width: 360px;
  padding: 20px;
  background: #020617;
  color: #fff;
  overflow-y: auto;
}

.sidebar h2 { 
  margin-top: 0; 
  color: #38bdf8;
}

.field {
  margin-bottom: 14px;
}

.field label {
  display: block;
  font-size: 13px;
  margin-bottom: 4px;
  color: #cbd5f5;
}

.field input,
.field select {
  width: 100%;
  padding: 8px;
  border-radius: 6px;
  border: none;
  margin-top: 4px;
}

.main {
  flex: 1;
  padding: 32px;
  overflow-y: auto;
}

.preview-box {
  background: #fff;
  padding: 24px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,.05);
  margin-bottom: 24px;
}

.playbook-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #2563eb;
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 16px;
}

.code-box {
  background: #020617;
  color: #38bdf8;
  padding: 16px;
  border-radius: 10px;
  white-space: pre;
  font-size: 13px;
  overflow-x: auto;
}
</style>
</head>

<body>

<div class="layout">
<!-- SIDEBAR -->
<div class="sidebar">
  <h2>Multi Dropdown Settings</h2>

  <div class="field">
    <label>Options (comma separated)</label>
    <input id="pb-options" value="Apple, Banana, Mango, Orange"/>
  </div>

  <div class="field">
    <label>Placeholder</label>
    <input id="pb-placeholder" value="Select fruit"/>
  </div>

  <div class="field">
    <label>Width</label>
    <input id="pb-width" value="260px"/>
  </div>

  <div class="field">
    <label>Multiple</label>
    <select id="pb-multiple">
      <option value="false">false</option>
      <option value="true">true</option>
    </select>
  </div>

  <div class="field">
    <label>Search</label>
    <select id="pb-search">
      <option value="false">false</option>
      <option value="true">true</option>
    </select>
  </div>

  <hr style="border: none; border-top: 1px solid #334155; margin: 16px 0;">

  <!-- STYLE CONTROLS -->
  <div class="field">
    <label>Background</label>
    <input type="color" id="pb-bg" value="#ffffff"/>
  </div>

  <div class="field">
    <label>Text Color</label>
    <input type="color" id="pb-color" value="#0f172a"/>
  </div>

  <div class="field">
    <label>Border Color</label>
    <input type="color" id="pb-border" value="#cbd5f5"/>
  </div>

  <div class="field">
    <label>Font Size</label>
    <input id="pb-fontsize" value="14px"/>
  </div>

  <div class="field">
    <label>Font Weight</label>
    <select id="pb-fontweight">
      <option value="400">400</option>
      <option value="500">500</option>
      <option value="600">600</option>
    </select>
  </div>

</div>

<!-- MAIN -->
<div class="main">
  <a href="../index.html" class="playbook-back">← Back to Playbook</a>
  <h1>Multi Dropdown</h1>
  
  <div class="preview-box">
    <div id="dropdownHost" style="width: 260px;"></div>
  </div>

  <h2>Generated HTML</h2>
  <div class="code-box" id="code"></div>
</div>

</div>

<script>
function bindPlaybook() {
  const host = document.getElementById("dropdownHost");
  const code = document.getElementById("code");

  function sync() {
    host.innerHTML = "";
    
    const options = v("pb-options");
    const placeholder = v("pb-placeholder");
    const width = v("pb-width");
    const multiple = v("pb-multiple");
    const search = v("pb-search");

    const bg = v("pb-bg");
    const color = v("pb-color");
    const border = v("pb-border");
    const fontSize = v("pb-fontsize");
    const fontWeight = v("pb-fontweight");

    // Create actual dropdown component
    host.style.width = width;
    host.dataset.ppSelect = "";
    host.dataset.options = options;
    host.dataset.placeholder = placeholder;
    host.dataset.multiple = multiple;
    host.dataset.search = search;
    host.dataset.bg = bg;
    host.dataset.color = color;
    host.dataset.bordercolor = border;
    host.dataset.fontsize = fontSize;
    host.dataset.fontweight = fontWeight;

    // Initialize component
    if (typeof initSelectMenus === "function") {
      initSelectMenus();
    }

    // Generate code
    code.textContent = `<div
  data-pp-select
  data-options="${options}"
  data-placeholder="${placeholder}"
  data-width="${width}"
  data-multiple="${multiple}"
  data-search="${search}"
  data-bg="${bg}"
  data-color="${color}"
  data-bordercolor="${border}"
  data-fontsize="${fontSize}"
  data-fontweight="${fontWeight}">
</div>`;
  }

  const fields = document.querySelectorAll(".sidebar input, .sidebar select");
  fields.forEach(f => f.addEventListener("input", sync));

  sync();
}

function v(id){ 
  return document.getElementById(id).value;
}

setTimeout(() => {
  bindPlaybook();
}, 500);
</script>

</body>
</html>
