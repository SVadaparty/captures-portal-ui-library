<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PP Link – Playbook</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Inter, system-ui, sans-serif;
  background: #f8fafc;
}

/* ===== LAYOUT ===== */
.layout {
  display: grid;
  grid-template-columns: 360px 1fr;
  height: 100vh;
}

/* ===== CONTROLS ===== */
.controls {
  background: #020617;
  color: white;
  padding: 20px;
  overflow-y: auto;
}

.controls h2 {
  color: #38bdf8;
  margin-top: 0;
}

.controls label {
  display: block;
  margin-top: 14px;
  font-size: 13px;
  color: #cbd5f5;
}

.controls input,
.controls select {
  width: 100%;
  padding: 8px;
  border-radius: 6px;
  border: none;
  margin-top: 4px;
}

/* ===== PREVIEW ===== */
.preview {
  padding: 32px;
  overflow-y: auto;
}

.preview-box {
  background: white;
  padding: 24px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,.05);
  margin-bottom: 24px;
}

pre {
  background: #020617;
  color: #38bdf8;
  padding: 16px;
  border-radius: 8px;
  font-size: 13px;
  overflow-x: auto;
}

.playbook-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #2563eb;
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 16px;
}
</style>
</head>

<body>

<div class="layout">

  <!-- ===== CONTROLS ===== -->
  <div class="controls">
    <h2>Link Settings</h2>

    <label>Link Text</label>
    <input id="pb-text" value="Visit OpenAI"/>

    <label>Redirect URL</label>
    <input id="pb-href" value="https://www.openai.com"/>

    <label>Target</label>
    <select id="pb-target">
      <option value="_self">Same Tab</option>
      <option value="_blank">New Tab</option>
    </select>

    <hr style="margin:16px 0;border-top:1px solid #333;">

    <h3 style="color:#38bdf8;font-size:14px;">Styles</h3>

    <label>Link Color</label>
    <input type="color" id="pb-color" value="#2563eb"/>

    <label>Font Size (px)</label>
    <input id="pb-size" type="number" value="16"/>

    <label>Font Weight</label>
    <input id="pb-weight" type="number" min="100" max="900" step="100" value="600"/>

    <label>Underline</label>
    <select id="pb-underline">
      <option value="underline">Yes</option>
      <option value="none">No</option>
    </select>
  </div>

  <!-- ===== PREVIEW ===== -->
  <div class="preview">

    <a href="../index.html" class="playbook-back">← Back to Playbook</a>

    <h1>Power Pages – Link</h1>

    <!-- LIVE PREVIEW -->
    <div class="preview-box">
      <div id="linkHost"></div>
    </div>

    <!-- GENERATED HTML -->
    <div class="preview-box">
      <h2>Generated HTML</h2>
      <pre id="codeBlock"></pre>
    </div>

  </div>
</div>

<script>
/* ===== HELPERS ===== */
function v(id) {
  return document.getElementById(id).value;
}

/* ===== PLAYBOOK SYNC ===== */
function sync() {
  const host = document.getElementById("linkHost");
  const code = document.getElementById("codeBlock");

  const text = v("pb-text");
  const href = v("pb-href");
  const target = v("pb-target");
  const color = v("pb-color");
  const size = v("pb-size");
  const weight = v("pb-weight");
  const underline = v("pb-underline");

  host.innerHTML = "";

  const link = document.createElement("a");
  link.href = href || "#";
  link.target = target;
  link.textContent = text || "Link";

  link.style.color = color;
  link.style.fontSize = size + "px";
  link.style.fontWeight = weight;
  link.style.textDecoration = underline;
  link.style.cursor = "pointer";

  host.appendChild(link);

  code.textContent =
`<a
  href="${href}"
  target="${target}"
  style="
    color: ${color};
    font-size: ${size}px;
    font-weight: ${weight};
    text-decoration: ${underline};
  ">
  ${text}
</a>`;
}

document
  .querySelectorAll(".controls input, .controls select")
  .forEach(el => el.addEventListener("input", sync));

window.addEventListener("load", sync);
</script>

</body>
</html>
