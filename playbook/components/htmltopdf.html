<!DOCTYPE html>
<html>

<head>
  <title>Power Pages UI Framework – PDF Wrapper</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="../dist/pp-ui-core.min.css" />
  <script src="../dist/pp-ui-core.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Segoe UI, system-ui, sans-serif;
      background: #f3f4f6;
    }

    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      height: 100vh;
    }

    .controls {
      background: #020617;
      color: white;
      padding: 20px;
      overflow-y: auto;
    }

    .controls h2 {
      color: #38bdf8;
    }

    .controls label {
      display: block;
      margin-top: 12px;
      font-size: 13px;
      color: #cbd5f5;
    }

    .controls input,
    .controls select {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: none;
      margin-top: 4px;
    }

    .preview {
      padding: 32px;
      overflow-y: auto;
    }

    .preview-box {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, .05);
      margin-bottom: 24px;
    }

    .playbook-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 16px;
    }

    pre {
      background: #020617;
      color: #38bdf8;
      padding: 16px;
      border-radius: 8px;
      font-size: 13px;
      overflow-x: auto;
    }

    /* Demo content */
    .demo-card {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 16px;
    }
  </style>
</head>

<body>

  <div class="layout">

    <!-- CONTROLS -->
    <div class="controls">
      <h2>PDF Wrapper Settings</h2>

      <label>Wrapper ID</label>
      <input id="pb-id" value="invoice-pdf" />

      <label>Document Title</label>
      <input id="pb-title" value="Invoice" />

      <label>Orientation</label>
      <select id="pb-orientation">
        <option value="portrait">portrait</option>
        <option value="landscape">landscape</option>
      </select>

      <label>Page Size</label>
      <select id="pb-pagesize">
        <option value="a4">A4</option>
        <option value="letter">Letter</option>
      </select>

      <label>Download Button Label</label>
      <input id="pb-downloadLabel" value="Export PDF" />
    </div>

    <!-- PREVIEW -->
    <div class="preview">

      <a href="../index.html" class="playbook-back">← Back to Playbook</a>

      <h1>Power Pages PDF Wrapper</h1>

      <!-- LIVE PREVIEW -->
      <div class="preview-box">
        <div id="pdfHost"></div>
      </div>

      <!-- GENERATED CODE -->
      <div class="preview-box">
        <h2>Generated HTML</h2>
        <pre id="codeBlock"></pre>
      </div>

    </div>

  </div>

  <script>
    function pb(id) {
      return document.getElementById(id).value;
    }

    function bindPlaybook() {
      let host = document.getElementById("pdfHost");
      const codeBlock = document.getElementById("codeBlock");

      function sync() {
        const cfg = {
          id: pb("pb-id"),
          title: pb("pb-title"),
          orientation: pb("pb-orientation"),
          pagesize: pb("pb-pagesize"),
          downloadLabel: pb("pb-downloadLabel")
        };

        /* ===== RECREATE WRAPPER (CRITICAL) ===== */
        const wrapper = document.createElement("div");
        wrapper.id = "pdfHost";
        wrapper.setAttribute("data-pp-pdf-wrapper", "");
        wrapper.dataset.id = cfg.id;
        wrapper.dataset.title = cfg.title;
        wrapper.dataset.orientation = cfg.orientation;
        wrapper.dataset.pagesize = cfg.pagesize;
        wrapper.dataset.downloadLabel = cfg.downloadLabel;

        wrapper.innerHTML = `
      <div class="demo-card">
        <h3>Invoice #INV-001</h3>
        <p>Date: 20 Jan 2026</p>
        <table style="width:100%;border-collapse:collapse;margin-top:10px">
          <tr><th>Item</th><th>Qty</th><th>Price</th></tr>
          <tr><td>Service A</td><td>1</td><td>$500</td></tr>
          <tr><td>Service B</td><td>2</td><td>$300</td></tr>
        </table>
      </div>
    `;

        host.replaceWith(wrapper);
        host = wrapper;

        window.initPdfWrappers();

        /* ===== GENERATED HTML ===== */
        codeBlock.textContent =
          `<div
  data-pp-pdf-wrapper
  data-id="${cfg.id}"
  data-title="${cfg.title}"
  data-orientation="${cfg.orientation}"
  data-pagesize="${cfg.pagesize}"
  data-download-label="${cfg.downloadLabel}">

  <!-- Your HTML content -->

</div>`;
      }

      document
        .querySelectorAll(".controls input, .controls select")
        .forEach(el => el.addEventListener("input", sync));

      sync();
    }

    window.addEventListener("load", bindPlaybook);
  </script>

</body>

</html>
