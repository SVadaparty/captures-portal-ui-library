<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PP Sidebar – Playbook</title>

<link rel="stylesheet" href="../../dist/pp-ui-core.min.css" />
<script src="../../dist/pp-ui-core.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Segoe UI, system-ui, sans-serif;
  background: #f3f4f6;
}

.layout {
  display: grid;
  grid-template-columns: 360px 1fr;
  height: 100vh;
}

.sidebar-panel {
  width: 360px;
  padding: 20px;
  background: #020617;
  color: #fff;
  overflow-y: auto;
}

.sidebar-panel h2 {
  margin-top: 0;
  color: #38bdf8;
}

.field {
  margin-bottom: 14px;
}

.field label {
  display: block;
  font-size: 13px;
  margin-bottom: 4px;
  color: #cbd5f5;
}

.field input,
.field select {
  width: 100%;
  padding: 8px;
  border-radius: 6px;
  border: none;
  margin-top: 4px;
}

.field textarea {
  width: 100%;
  padding: 8px;
  border-radius: 6px;
  border: none;
  margin-top: 4px;
  font-family: monospace;
  font-size: 12px;
  resize: vertical;
}

.main {
  padding: 32px;
  overflow-y: auto;
}

.preview-box {
  background: #fff;
  padding: 24px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,.05);
  margin-bottom: 24px;
}

.playbook-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #2563eb;
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 16px;
}

.code-box {
  background: #020617;
  color: #38bdf8;
  padding: 16px;
  border-radius: 10px;
  font-size: 13px;
  overflow-x: auto;
  white-space: pre;
}
</style>
</head>

<body>

<div class="layout">
<!-- ========== CONTROLS ========== -->
<div class="sidebar-panel">
  <h2>Sidebar Settings</h2>

  <div class="field">
    <label>Background Color</label>
    <input type="color" id="pb-bg" value="#0f172a">
  </div>

  <div class="field">
    <label>Text Color</label>
    <input type="color" id="pb-color" value="#e5e7eb">
  </div>

  <div class="field">
    <label>Width</label>
    <input id="pb-width" value="260px">
  </div>

  <div class="field">
    <label>Font Size</label>
    <input id="pb-fontsize" value="14px">
  </div>

  <div class="field">
    <label>Font Weight</label>
    <select id="pb-fontweight">
      <option value="400">400 (Normal)</option>
      <option value="500">500</option>
      <option value="600">600</option>
      <option value="700">700 (Bold)</option>
    </select>
  </div>

  <div class="field">
    <label>Collapsible</label>
    <select id="pb-collapsible">
      <option value="false">false</option>
      <option value="true">true</option>
    </select>
  </div>

  <div class="field">
    <label>Open by Default</label>
    <select id="pb-open">
      <option value="true">true</option>
      <option value="false">false</option>
    </select>
  </div>

  <div class="field">
    <label>Sidebar Content</label>
    <textarea id="pb-content" rows="5">
<h3>Navigation</h3>
<ul>
  <li>Dashboard</li>
  <li>Users</li>
  <li>Settings</li>
</ul>
    </textarea>
  </div>
</div>

<!-- ========== MAIN ========== -->
<div class="main">

  <a href="../index.html" class="playbook-back">← Back to Playbook</a>

  <h1>Sidebar</h1>

  <h2>Live Preview</h2>
  <div class="preview-box" id="preview"></div>

  <h2>Generated HTML</h2>
  <div class="code-box" id="code"></div>

</div>

</div>

<script>
function bindPlaybook() {
  const preview = document.getElementById("preview");
  const code = document.getElementById("code");

  function sync() {
    const bg = v("pb-bg");
    const color = v("pb-color");
    const width = v("pb-width");
    const fontSize = v("pb-fontsize");
    const fontWeight = v("pb-fontweight");
    const collapsible = v("pb-collapsible");
    const open = v("pb-open");
    const content = v("pb-content");

    /* ===== PREVIEW ===== */
    preview.innerHTML = `
<button
  data-pp-sidebar-toggle
  style="margin-bottom:12px;padding:8px 12px;cursor:pointer">
  Toggle Sidebar
</button>

<div
  data-pp-sidebar
  data-bg="${bg}"
  data-text-color="${color}"
  data-width="${width}"
  data-fontsize="${fontSize}"
  data-fontweight="${fontWeight}"
  data-collapsible="${collapsible}"
  data-open="${open}">
  ${content}
</div>
`;

    // Re-init
    if (typeof initSidebars === "function") {
      initSidebars();
    }

    /* ===== GENERATED CODE ===== */
    code.textContent = `<button data-pp-sidebar-toggle>Toggle Sidebar</button>

<div
  data-pp-sidebar
  data-bg="${bg}"
  data-text-color="${color}"
  data-width="${width}"
  data-fontsize="${fontSize}"
  data-fontweight="${fontWeight}"
  data-collapsible="${collapsible}"
  data-open="${open}">
  ${content}
</div>`;
  }

  const fields = document.querySelectorAll(
    ".sidebar-panel input, .sidebar-panel select, .sidebar-panel textarea"
  );
  fields.forEach(el => el.addEventListener("input", sync));

  sync();
}

function v(id) {
  return document.getElementById(id).value;
}

setTimeout(() => {
  bindPlaybook();
}, 500);
</script>

</body>
</html>
