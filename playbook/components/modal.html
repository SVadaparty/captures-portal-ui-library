<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PP Modal – Playbook</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      display: flex;
      height: 100vh;
      background: #f8fafc;
    }

    /* =========================
       SIDEBAR
    ========================= */
    .sidebar {
      width: 320px;
      padding: 20px;
      background: #ffffff;
      border-right: 1px solid #e5e7eb;
      overflow-y: auto;
    }

    .sidebar h2 {
      margin-top: 0;
      font-size: 18px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 13px;
      color: #475569;
      margin-bottom: 4px;
    }

    .field input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #cbd5f5;
      font-size: 14px;
    }

    /* =========================
       MAIN
    ========================= */
    .main {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }

    .preview-box {
      padding: 20px;
      background: #ffffff;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      margin-bottom: 24px;
    }

    .code-box {
      background: #0f172a;
      color: #e5e7eb;
      padding: 16px;
      border-radius: 10px;
      font-size: 13px;
      overflow-x: auto;
      white-space: pre;
      position: relative;
    }

    .copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* =========================
       MODAL STYLES
    ========================= */
    .pp-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      alignItems: center;
      z-index: 1000;
    }

    .pp-modal {
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      max-width: 500px;
      width: 90%;
      position: relative;
    }

    .pp-modal-close {
      position: absolute;
      top: 10px;
      right: 12px;
      border: none;
      background: transparent;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- =========================
     SIDEBAR CONTROLS
========================= -->
<div class="sidebar">
  <h2>Modal Settings</h2>

  <div class="field">
    <label>Modal ID</label>
    <input id="modalId" value="example-modal" />
  </div>

  <div class="field">
    <label>Trigger Button Text</label>
    <input id="triggerText" value="Open Modal" />
  </div>

  <div class="field">
    <label>Modal Body Text</label>
    <input id="modalBody" value="This is modal content" />
  </div>

  <div class="field">
    <label>Footer Text</label>
    <input id="modalFooter" value="Footer area" />
  </div>
</div>

<!-- =========================
     MAIN AREA
========================= -->
<div class="main">
  <h2>Live Preview</h2>

  <div class="preview-box" id="preview"></div>

  <h2>Generated HTML</h2>
  <div class="code-box">
    <button class="copy-btn" onclick="copyCode()">Copy</button>
    <code id="codeOutput"></code>
  </div>
</div>

<script>
  const inputs = document.querySelectorAll(".sidebar input");
  inputs.forEach(i => i.addEventListener("input", render));

  function render() {
    const id = modalId.value.trim();
    const trigger = triggerText.value;
    const body = modalBody.value;
    const footer = modalFooter.value;

    /* ===== PREVIEW ===== */
    preview.innerHTML = `
      <button onclick="document.getElementById('${id}').style.display='flex'"
        style="background:#f59e0b;color:#fff;border:none;
        padding:10px 18px;border-radius:6px;cursor:pointer">
        ${trigger}
      </button>

      <div id="${id}" class="pp-modal-overlay">
        <div class="pp-modal">
          <button class="pp-modal-close"
            onclick="document.getElementById('${id}').style.display='none'">✕</button>

          <div>${body}</div>

          <div style="margin-top:16px;border-top:1px solid #e5e7eb;padding-top:10px">
            ${footer}
          </div>
        </div>
      </div>
    `;

    /* ===== CODE ===== */
    codeOutput.textContent = `
<button data-pp-modal-trigger data-target="${id}">${trigger}</button>

<div data-pp-modal id="${id}">
  <div data-pp-modal-body>
    ${body}
  </div>

  <div data-pp-modal-footer>
    ${footer}
  </div>
</div>
    `.trim();
  }

  function copyCode() {
    navigator.clipboard.writeText(codeOutput.textContent);
    alert("Code copied");
  }

  render();
</script>

</body>
</html>
