<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PP Modal – Playbook</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Inter, Arial, sans-serif;
  display: flex;
  height: 100vh;
  background: #f8fafc;
}

/* ================= SIDEBAR ================= */
.sidebar {
  width: 320px;
  padding: 20px;
  background: #ffffff;
  border-right: 1px solid #e5e7eb;
  overflow-y: auto;
}

.sidebar h2 {
  margin-top: 0;
  font-size: 18px;
}

.field {
  margin-bottom: 14px;
}

.field label {
  display: block;
  font-size: 13px;
  color: #475569;
  margin-bottom: 4px;
}

.field input {
  width: 100%;
  padding: 8px 10px;
  border-radius: 6px;
  border: 1px solid #cbd5f5;
  font-size: 14px;
}

/* ================= MAIN ================= */
.main {
  flex: 1;
  padding: 24px;
  overflow-y: auto;
}

.preview-box {
  padding: 20px;
  background: #ffffff;
  border-radius: 10px;
  border: 1px solid #e5e7eb;
  margin-bottom: 24px;
}

.code-box {
  background: #0f172a;
  color: #e5e7eb;
  padding: 16px;
  border-radius: 10px;
  font-size: 13px;
  overflow-x: auto;
  white-space: pre;
  position: relative;
}

.copy-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  background: #2563eb;
  color: #fff;
  border: none;
  padding: 6px 10px;
  font-size: 12px;
  border-radius: 6px;
  cursor: pointer;
}

/* ================= MODAL ================= */
.pp-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

.pp-modal {
  background: #fff;
  border-radius: 10px;
  max-width: 600px;
  width: 90%;
  overflow: hidden;
  position: relative;
}

/* HEADER */
.pp-modal-header {
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid #e5e7eb;
  padding: 0 48px;
  font-weight: 600;
}

/* BODY */
.pp-modal-body {
  padding: 16px;
}

/* FOOTER */
.pp-modal-footer {
  padding: 12px 16px;
  border-top: 1px solid #e5e7eb;
}

/* CLOSE BUTTON */
.pp-modal-close {
  position: absolute;
  top: 14px;
  right: 14px;
  background: transparent;
  border: none;
  font-size: 18px;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">
  <h2>Modal Settings</h2>

  <div class="field">
    <label>Modal ID</label>
    <input id="modalId" value="myModal">
  </div>

  <div class="field">
    <label>Trigger Button Text</label>
    <input id="triggerText" value="Open Modal">
  </div>

  <div class="field">
    <label>Header Text</label>
    <input id="modalHeader" value="This is Header area">
  </div>

  <div class="field">
    <label>Footer Text</label>
    <input id="modalFooter" value="This is footer content">
  </div>
</div>

<!-- ================= MAIN ================= -->
<div class="main">
  <h2>Live Preview</h2>

  <div class="preview-box" id="preview"></div>

  <h2>Generated HTML</h2>
  <div class="code-box">
    <button class="copy-btn" onclick="copyCode()">Copy</button>
    <code id="codeOutput"></code>
  </div>
</div>

<script>
const inputs = document.querySelectorAll(".sidebar input");
inputs.forEach(i => i.addEventListener("input", render));

function render() {
  const id = modalId.value.trim();
  const trigger = triggerText.value;
  const header = modalHeader.value;
  const footer = modalFooter.value;

  /* ================= PREVIEW ================= */
  preview.innerHTML = `
    <button onclick="openModal('${id}')"
      style="background:#f59e0b;color:#fff;border:none;
      padding:10px 18px;border-radius:6px;cursor:pointer">
      ${trigger}
    </button>

    <div id="${id}" class="pp-modal-overlay" onclick="overlayClick(event, '${id}')">
      <div class="pp-modal">
        <button class="pp-modal-close" onclick="closeModal('${id}')">✕</button>

        <div class="pp-modal-header">
          ${header}
        </div>

        <div class="pp-modal-body">
          <!-- Any component can live here -->
          <div style="padding:8px;background:#f1f5f9;border-radius:6px">
            Table / form / any component goes here
          </div>
        </div>

        <div class="pp-modal-footer">
          <strong>${footer}</strong>
          <button style="margin-left:10px;padding:6px 10px">Submit</button>
        </div>
      </div>
    </div>
  `;

  /* ================= GENERATED CODE ================= */
  codeOutput.textContent = `
<div data-pp-modal data-id="${id}">
  <div data-pp-modal-header>
    <h2 style="margin:0; text-align:center;">${header}</h2>
  </div>

  <div data-pp-modal-body>
    <!-- Any component here -->
  </div>

  <div data-pp-modal-footer>
    <strong>${footer}</strong>
    <button>Submit</button>
  </div>
</div>
`.trim();
}

function openModal(id) {
  document.getElementById(id).style.display = "flex";
}

function closeModal(id) {
  document.getElementById(id).style.display = "none";
}

/* ✅ CLICK OUTSIDE TO CLOSE */
function overlayClick(e, id) {
  if (e.target.classList.contains("pp-modal-overlay")) {
    closeModal(id);
  }
}

function copyCode() {
  navigator.clipboard.writeText(codeOutput.textContent);
  alert("Code copied");
}

render();
</script>

</body>
</html>
